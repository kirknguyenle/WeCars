#VRML_SIM R2023b utf8

PROTO car_body [
    field SFString name "car_body"
    field SFVec3f dimensions 2 1 0.333
    field SFFloat car_mass 1200
    field MFNode extension []
    field SFString controller "SLA_Car"

]
{
#generate IMU location
%< 
 let car_dimensions = fields.dimensions.value;
 let car_shrink = {x: car_dimensions.x -0.1, y: car_dimensions.y -0.1, z: car_dimensions.z -0.1};
 let imu_translation = {x: 0, y: 0, z: car_shrink.z + 0.01};
>%

 DEF car Robot {
      children[
      
      Group {
        children IS extension
      }

      DEF car_shape Shape {
        appearance PBRAppearance {
          baseColor 0.917647 0.145098 0.145098
          roughness 1
          metalness 0
        }
        geometry Box {
          size %<=car_shrink.x>% %<=car_shrink.y>% %<=car_shrink.z>%
        }
      }
        DEF imu InertialUnit{
            translation %<=imu_translation.x>% %<=imu_translation.y>% %<=imu_translation.z>%
            children[
                DEF sensor_shape Shape{
                appearance PBRAppearance {}
                geometry Box {
                size 0.01 0.01 0.01
                }
               }
            ]
            boundingObject USE sensor_shape
            name "imu"
            physics Physics {
              mass 0.01
            }
        }
        DEF accelerometer Accelerometer{
          name "accel"
        }
        DEF diffManager Accelerometer{
          translation %<=-car_dimensions.x/2 - 0.4>% 0 0
          name "diffMan"
        }
        DEF gps GPS{
            translation %<=imu_translation.x>% %<=imu_translation.y>% %<=imu_translation.z+0.02>%
            children[
                DEF sensor_shape Shape{
                appearance PBRAppearance {}
                geometry Box {
                size 0.01 0.01 0.01
                }
               }
            ]
            boundingObject USE sensor_shape
            name "gps"
            physics Physics {
              mass 0.01
            }
        }

      ]
      name "car_body"
      boundingObject USE car_shape
      physics Physics {
        density -1
        mass IS car_mass
      }
      supervisor TRUE
      controller IS controller
    }
}