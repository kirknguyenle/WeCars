#VRML_SIM R2023b utf8
# template language: javascript
PROTO SingleSuspension [
  // Dimension are done in ISO vehicle fixed coordinate system
  // The values should come from the left side of the car, not the right side
  // Origin is the center of the wheel
  // this is just a snapshot of the suspension at a given ride height. 
  // this module is not suitable for simulating suspension with anti-roll bars, or other complex suspension systems.(No Mode Decoupled, No Active Suspesnion)
  field SFFloat KnuckleHeight 0.134 // height of the knuckle (scalar from lower ball join to upper balljoint) in meters
  field SFVec3f UpperBallJoint 0 0 0 // Upper ball joint relative to wheel center in meters
  field SFVec3f LowerBallJoint 0 0 0 // Lower ball joint relative to wheel center in meters
  field SFFloat WheelRadius 0.2286 // Wheel radius in meters
  field SFFloat WheelWidth 0.1524 // Wheel width in meters
  field SFVec3f TieRodAttachmentPoint 0 0 0 // Tie rod attachment point relative to wheel center in meters
  field SFFloat TieRodLength 0.3048 // Length of the tie rod in meters
  field SFVec3f TieRodPickupPoint 0 0 0 // Tie rod pickup point relative to wheel center in meters
  field SFFloat LowerArmLength 0.3048 // Length of the lower front link in meters
  field SFFloat UpperArmLength 0.3048 // Length of the upper front link in meters
  field SFVec3f UpperPickupPoint 0 0 0 // Upper front link pickup point relative to wheel center in meters
  field SFVec3f LowerPickupPoint 0 0 0 // Lower front link pickup point relative to wheel center in meters

  field boolean useMcphereson false // use Mcphereson strut instead of double wishbone
  field SFFloat McpheresonStrutLength 0.3048 // Length of the Mcphereson strut in meters
  field SFVec3f McpheresonStrutPickupPoint 0 0 0 // Mcphereson strut pickup point relative to wheel center in meters

  field SFFloat tireRadius 0.2286 // tire radius in meters
  field SFFloat tireWidth 0.1524 // tire width in meters


  field boolean use_damper true // simulate damper
  field boolean use_spring true // simulate spring
  field SFFloat SpringRate 10000 // Spring rate in N/m
  field SFFloat SpringPreload 0 // Spring preload in meters
  field SFFloat SpringFreeLength 0.3048 // Spring free length in meters
  field SFFloat SpringDamping 1000 // Spring damping in N/m/s
  field SFString name "Suspension" // Name of the suspension
  field SFString controller "Suspension_controller" // Name of the controller

  field boolean flipRight false // flip the suspension to the left side of the car

]
{
  %<
  import * as wbgeometry from 'wbgeometry.js';
  import * as wbrandom from 'wbrandom.js';
  import * as wbvector3 from 'wbvector3.js';

  // set SLA suspension values
  let KH = fields.KnuckleHeight.value;
  let UBJ = fields.UpperBallJoint.value;
  let LBJ = fields.LowerBallJoint.value;
  let WR = fields.WheelRadius.value;
  let WW = fields.WheelWidth.value;
  let TRAP = fields.TieRodAttachmentPoint.value;
  let UAL = fields.UpperArmLength.value;
  let LAL = fields.LowerArmLength.value;
  let TR = fields.TieRodLength.value;
  let UPP = fields.UpperPickupPoint.value;
  let LPP = fields.LowerPickupPoint.value;
  let TRPP = fields.TieRodPickupPoint.value;
  
 // set Mcphereson strut values
  let useMcphereson = fields.use_Mcphereson.value;
  let McpheresonStrutLength = fields.McpheresonStrutLength.value;
  let mCPP = fields.McpheresonStrutPickupPoint.value;
  
  // set coilover values
  let useDamper = fields.use_damper.value;
  let useSpring = fields.use_spring.value;
  let SpringRate = fields.SpringRate.value;
  let SpringPreload = fields.SpringPreload.value;
  let SpringDamping = fields.SpringDamping.value;
  let flipRight = fields.flipRight.value;
  >% 

  DEF SingleSuspension Robot{
       
   }

}





