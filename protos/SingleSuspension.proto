  // let mag_upper = Math.sqrt(Math.pow((UFPP.x-URPP.x),2)+Math.pow((UFPP.y-URPP.y),2)+Math.pow((UFPP.z-URPP,2));
  let mag_upper =  Math.sqrt(Math.pow((UFPP.x-URPP.x),2)+Math.pow((UFPP.y-URPP.y),2)+Math.pow((UFPP.z-URPP.z),2));
