 // set Mcphereson strut values
  let useMcphereson = fields.use_Mcphereson.value;
  let McpheresonStrutLength = fields.McpheresonStrutLength.value;
  let McpheresonStrutPickupPoint = fields.McpheresonStrutPickupPoint.value;
  
  // set coilover values
  let useDamper = fields.use_damper.value;
  let useSpring = fields.use_spring.value;
  let SpringRate = fields.SpringRate.value;
  let SpringPreload = fields.SpringPreload.value;
  let SpringFreeLength = fields.SpringFreeLength.value;
  let SpringDamping = fields.SpringDamping.value;
  let ControlRodLength = fields.ControlRodLength.value;
  let BCPP = fields.BellCrankPickupPoint.value;
  let BCI = fields.BellCrankIn.value;
  let BCO = fields.BellCrankOut.value; 
  let BCA = fields.BellCrankAngle.value;
